# Hangs boot after apu_top powers the APU (AI unit); see initramfs/modules.blocklist
blacklist apu_top
blacklist apusys
blacklist sapu
install apusys /bin/false
# Mali/GPU modules of other MediaTek SoCs (built by the shared gpu/ ext tree); their
# generic DT alias makes udev try them and they fail with "already registered".
blacklist mali_prot_alloc_mt6989_r44
blacklist mali_prot_alloc_mt6897
blacklist mali_prot_alloc_mt6985
blacklist mali_prot_alloc_mt6985_r44
blacklist mali_prot_alloc_mt6897_r44
