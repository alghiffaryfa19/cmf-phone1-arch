# Playback_1 = PCM 0 (memif DL0), Capture_1 = PCM 13 (memif UL9 / UL_CM1).
# TODO jack detection: JackControl "Headset Jack" (iface=CARD) works in amixer, but
# PipeWire's ACP fails with "Unable to determine open mixer device" for it, leaving the
# ports "availability unknown". Until then: speaker/internal mic are the defaults (higher
# priority), headphones/headset mic are selected manually.

# MTK DPCM front ends fail hw_params unless some back end is connected, and PipeWire
# probes the PCMs before enabling any device. So the verb keeps DL0 on the unused
# I2SOUT1 (silent) and UL9 on the codec UL; devices only add their own paths.
SectionVerb {
	EnableSequence [
		cset "name='DAC In Mux' Normal Path"
		cset "name='I2SOUT1_CH1 DL0_CH1' 1"
		cset "name='I2SOUT1_CH2 DL0_CH2' 1"
		cset "name='UL9_CH1 ADDA_UL_CH1' 1"
		cset "name='UL9_CH2 ADDA_UL_CH2' 1"
	]
	DisableSequence [
		cset "name='I2SOUT1_CH1 DL0_CH1' 0"
		cset "name='I2SOUT1_CH2 DL0_CH2' 0"
		cset "name='UL9_CH1 ADDA_UL_CH1' 0"
		cset "name='UL9_CH2 ADDA_UL_CH2' 0"
	]
	Value {
		TQ "HiFi"
	}
}

# Smart PA on I2SOUT4 (DT mediatek,spk-i2s = MTK_SPK_I2S_OUT4); Android: PLAYBACK1_TO_I2S1
SectionDevice."Speaker" {
	Comment "Speaker"
	ConflictingDevice [ "Headphones" "Earpiece" ]
	EnableSequence [
		cset "name='I2SOUT4_CH1 DL0_CH1' 1"
		cset "name='I2SOUT4_CH2 DL0_CH2' 1"
	]
	DisableSequence [
		cset "name='I2SOUT4_CH1 DL0_CH1' 0"
		cset "name='I2SOUT4_CH2 DL0_CH2' 0"
	]
	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
	}
}

# Android: PLAYBACK1_TO_ADDA_DL + headphone_output
SectionDevice."Headphones" {
	Comment "Headphones"
	ConflictingDevice [ "Speaker" "Earpiece" ]
	EnableSequence [
		cset "name='ADDA_DL_CH1 DL0_CH1' 1"
		cset "name='ADDA_DL_CH2 DL0_CH2' 1"
		cset "name='HPL Mux' Audio Playback"
		cset "name='HPR Mux' Audio Playback"
	]
	DisableSequence [
		cset "name='HPL Mux' Open"
		cset "name='HPR Mux' Open"
		cset "name='ADDA_DL_CH1 DL0_CH1' 0"
		cset "name='ADDA_DL_CH2 DL0_CH2' 0"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackCTL "hw:${CardId}"
		JackControl "Headset Jack"
	}
}

# Android: PLAYBACK1_TO_ADDA_DL + receiver_output
SectionDevice."Earpiece" {
	Comment "Earpiece"
	ConflictingDevice [ "Speaker" "Headphones" ]
	EnableSequence [
		cset "name='ADDA_DL_CH1 DL0_CH1' 1"
		cset "name='ADDA_DL_CH2 DL0_CH2' 1"
		cset "name='RCV Mux' Voice Playback"
	]
	DisableSequence [
		cset "name='RCV Mux' Open"
		cset "name='ADDA_DL_CH1 DL0_CH1' 0"
		cset "name='ADDA_DL_CH2 DL0_CH2' 0"
	]
	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
	}
}

# Android: builtin_Mic_SingleMic + ADDA_TO_CAPTURE1
SectionDevice."Mic" {
	Comment "Internal Microphone"
	ConflictingDevice [ "Headset" ]
	EnableSequence [
		cset "name='MISO0_MUX' UL1_CH1"
		cset "name='MISO1_MUX' UL1_CH1"
		cset "name='ADC_L_Mux' Left Preamplifier"
		cset "name='PGA_L_Mux' AIN0"
	]
	DisableSequence [
		cset "name='MISO1_MUX' UL1_CH2"
		cset "name='ADC_L_Mux' Idle"
		cset "name='PGA_L_Mux' None"
	]
	Value {
		CapturePriority 300
		CapturePCM "hw:${CardId},13"
	}
}

# Android: headset_mic_input + ADDA_TO_CAPTURE1
SectionDevice."Headset" {
	Comment "Headset Microphone"
	ConflictingDevice [ "Mic" ]
	EnableSequence [
		cset "name='MISO0_MUX' UL1_CH1"
		cset "name='MISO1_MUX' UL1_CH1"
		cset "name='ADC_L_Mux' Left Preamplifier"
		cset "name='PGA_L_Mux' AIN1"
	]
	DisableSequence [
		cset "name='MISO1_MUX' UL1_CH2"
		cset "name='ADC_L_Mux' Idle"
		cset "name='PGA_L_Mux' None"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},13"
		JackCTL "hw:${CardId}"
		JackControl "Headset Jack"
	}
}
