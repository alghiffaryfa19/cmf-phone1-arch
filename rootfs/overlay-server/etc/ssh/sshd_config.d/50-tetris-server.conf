# Server profile: reachable over WLAN, so keys only there (build-rootfs.sh / setup-server.sh
# install the project key and the PC user's keys for alarm). Over the USB cable
# (172.16.42.0/24) the password still works, so you can't lock yourself out.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no

Match Address 172.16.42.0/24
    PasswordAuthentication yes
